schema_version: flagcicd.project/v1
repository: TransformerEngine-FL

# This manifest describes the repository-facing contract. The existing
# platform files remain the source of truth for runners and test matrices.
entry_workflow: .github/workflows/flagcicd-entry.yml
platform_config_glob: .github/configs/*.yml

levels:
  L0:
    support: supported
    purpose: preflight-and-smoke
    timeout_minutes: 15
  L1:
    support: supported
    purpose: pull-request-unit
    timeout_minutes: 60
  L2:
    support: supported
    purpose: representative-integration
    timeout_minutes: 360
  L3:
    support: partial
    purpose: full-regression-and-compatibility
    timeout_minutes: 360
    reason: common unit and integration workflows are wired; benchmark and version compatibility are pending
  L4:
    support: planned
    purpose: release-and-model-validation
    timeout_minutes: 2880
    reason: model-and-release workflows are not yet wired to the common entry

risk_rules:
  version: v1
  default_level: L1
  unknown_change: escalate
  rules:
    - id: ci-and-build
      paths:
        - .github/**
        - CMakeLists.txt
        - cmake/**
        - setup.py
        - pyproject.toml
      minimum_level: L2
    - id: native-extension
      paths:
        - transformer_engine/**/csrc/**
        - transformer_engine/**/cpp/**
        - transformer_engine/**/cuda/**
      minimum_level: L3
    - id: numerical-and-performance
      paths:
        - tests/pytorch/**
        - tests/plugin/**
        - qa/**
      minimum_level: L1

coverage:
  language: python
  tool: coverage.py
  source_roots:
    - transformer_engine
  metric_types:
    - line
    - branch
  preserve_raw_fragments: true
  report_schema: flagcicd.report/v1

images:
  layers:
    - base
    - vendor
    - runtime
    - source
    - test
  reuse_key:
    - base_digest
    - vendor_sdk
    - toolchain
    - lockfile_hash
    - source_sha
    - test_level
    - instrumentation

report:
  artifact: flagcicd-report.json
  statuses:
    - passed
    - test_failed
    - build_failed
    - infra_error
    - unsupported
    - skipped
    - cancelled
    - report_error
