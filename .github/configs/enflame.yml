# Enflame / GCU configuration for TransformerEngine-FL.
# Keep chip-specific setup out of common workflows.

hardware_name: enflame
display_name: 'Enflame GCU'
checkout_submodules: recursive

ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:enflame-dev
container_pull_policy: always

runner_labels:
  - sy-8g-cicd-te

container_volumes:
  - /usr/local/gcu:/usr/local/gcu

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/gcuctl
  --device=/dev/gcu0
  --device=/dev/gcu1
  --device=/dev/gcu2
  --device=/dev/gcu3
  --device=/dev/gcu4
  --device=/dev/gcu5
  --device=/dev/gcu6
  --device=/dev/gcu7

setup_script: .github/scripts/setup_enflame.sh

device_types:
  - gcu

coverage:
  enabled: true
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

nproc_per_node: 2

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: tests/plugin/backend/enflame/run_native.sh
    args: [debug]

  - name: pytorch_unittest
    runner: script
    path: tests/plugin/backend/enflame/run_native.sh
    args: [unittest]

  - name: pytorch_distributed_unittest
    runner: script
    path: tests/plugin/backend/enflame/run_native.sh
    args: [distributed]

  - name: pytorch_onnx_unittest
    runner: script
    path: tests/plugin/backend/enflame/run_native.sh
    args: [onnx]
