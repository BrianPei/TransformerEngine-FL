# MooreThreads MUSA Hardware Configuration for TransformerEngine-FL
# This file defines CI/CD settings for MooreThreads MUSA-based testing.
# This file defines environment variables, volumes, and test filters for TE tests.

hardware_name: mthreads
display_name: 'MooreThreads MUSA Tests'

# CI image for MooreThreads MUSA dev env
ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:20260729-mthreads-dev

# Runner labels for self-hosted MooreThreads node
# Adjust this label to match the actual GitHub Actions runner label.
runner_labels:
  - mt-8g-cicd-megatron

# Container volumes
container_volumes:
  - /dev/dri:/dev/dri
  - /home/flagscale_cicd/flask/static:/workspace/report

# Container options
container_options: >-
  --runtime=mthreads
  --ipc=host
  --network=host
  --privileged=true
  --shm-size=100gb
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --group-add video
  -e PLATFORM=mthreads
  -e MTHREADS_VISIBLE_DEVICES=all
  -e MTHREADS_DRIVER_CAPABILITIES=all
  -e MUSA_HOME=/usr/local/musa
  -e TORCH_DEVICE_BACKEND_AUTOLOAD=0
  -e TE_FL_ENABLE_MUSA_CUDA_COMPAT=1
  -e LD_LIBRARY_PATH=/usr/lib:/usr/lib/x86_64-linux-gnu:/usr/local/musa/lib:/usr/local/openmpi/lib:$LD_LIBRARY_PATH

# Platform-specific environment setup script
setup_script: .github/scripts/setup_mthreads.sh

# Source checkout behavior
checkout:
  pre_script: ''
  fetch_depth: 0
  submodules: 'false'
  set_safe_directory: true
  attempts: 1

# Runtime environment activation used by common workflows before tests.
test_env_script: |
  echo "MThreads image uses system Python: $(which python3)"

# Backend/API sanity check used by common unit workflow.
backend_check:
  module: transformer_engine_musa_torch
  required_symbols:
    - multi_tensor_scale
    - multi_tensor_compute_scale_and_scale_inv

# Build environment variables (platform-specific)
build_env:
  TE_FL_SKIP_CUDA: '1'
  SKIP_CUDA_BUILD: '1'
  NVTE_WITH_CUDA: '0'
  NVTE_WITH_MACA: '0'
  NVTE_FRAMEWORK: pytorch
  TE_FL_ENABLE_MUSA_CUDA_COMPAT: '1'
  TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
  TORCHDYNAMO_DISABLE: '1'
  TORCH_COMPILE_DISABLE: '1'
  NVTE_TORCH_COMPILE: '0'
  NVTE_FLASH_ATTN: '0'
  NVTE_FUSED_ATTN: '0'
  NVTE_UNFUSED_ATTN: '1'
  MUSA_HOME: /usr/local/musa
  CUDA_HOME: /usr/local/musa
  TE_FL_PER_OP: 'layernorm_fwd=reference|flagos|vendor;layernorm_bwd=reference|flagos|vendor'

# Device types to run tests on
device_types:
  - s5000

# Test matrix configuration
test_matrix:
  unit:
    devices:
      - s5000
    ignored_tests: []
