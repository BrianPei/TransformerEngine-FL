# Hygon DCU / DTK configuration for TransformerEngine-FL plugin QA.

hardware_name: hygon
display_name: 'Hygon DCU (DTK)'
checkout_submodules: 'false'

ci_image: harbor.baai.ac.cn/flagos-dev/transformerengine-fl:manual-20260717-hygon-dev

runner_labels:
  - hg-8g-cicd-te

container_volumes:
  - /opt/hyhal:/opt/hyhal

container_options: >-
  --privileged
  --ipc=host
  --shm-size=100g
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/kfd
  --device=/dev/dri
  --group-add video

setup_script: .github/scripts/setup_hygon.sh

build_env:
  PLATFORM: hygon
  TE_FL_SKIP_CUDA: '1'
  TE_FL_PREFER: vendor
  NVTE_FRAMEWORK: pytorch
  NVTE_FLASH_ATTN: '0'
  NVTE_FUSED_ATTN: '0'
  NVTE_UNFUSED_ATTN: '1'
  NVTE_UnfusedDPA_Emulate_FP8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

coverage:
  enabled: false
  required: false
  python: python3
  sources:
    - transformer_engine
  include:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

unit_test_matrix:
  - name: pytorch_debug
    runner: script
    path: qa/plugin/hygon/test.sh
    args: [debug]
    env:
      XML_LOG_DIR: logs/L0_pytorch_debug_unittest-hygon

  - name: pytorch_unittest
    runner: script
    path: qa/plugin/hygon/test.sh
    args: [unittest]
    env:
      XML_LOG_DIR: logs/L0_pytorch_unittest-hygon

  - name: pytorch_distributed_unittest
    runner: script
    path: qa/plugin/hygon/test.sh
    args: [distributed]
    env:
      XML_LOG_DIR: logs/L1_pytorch_distributed_unittest-hygon

  - name: pytorch_onnx_unittest
    runner: script
    path: qa/plugin/hygon/test.sh
    args: [onnx]
    env:
      XML_LOG_DIR: logs/L1_pytorch_onnx_unittest-hygon

integration_test_matrix:
  - name: pytorch_mcore_integration
    path: qa/L1_pytorch_mcore_integration/test.sh
    env:
      PLATFORM: hygon
      TE_FL_PREFER: vendor
      MCORE_REPO_URL: https://github.com/flagos-ai/Megatron-LM-FL.git
      MCORE_REF: 175ae90ec92a9e6fea2d74ccd24d6a1835d3ae82
      DISTRIBUTED_BACKEND: nccl
      NUM_LAYERS: '2'
      HIDDEN_SIZE: '128'
      NUM_ATTENTION_HEADS: '4'
      SEQ_LENGTH: '128'
      MICRO_BATCH_SIZE: '1'
      GLOBAL_BATCH_SIZE: '1'
      ENABLE_DIAGNOSTICS: '0'

device_types:
  - bw1000
