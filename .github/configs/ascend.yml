# Huawei Ascend NPU configuration for TransformerEngine-FL
# This file follows the same schema as cuda.yml and metax.yml.

hardware_name: ascend
display_name: 'Huawei Ascend NPU'
checkout_submodules: 'false'

# CI image for the Ascend environment
ci_image: harbor.baai.ac.cn/transformerengine-fl/flagscale:te-fl-triton311

# Runner labels for the self-hosted Ascend node
runner_labels:
  - hw-8g-cicd-te

# Container volumes
container_volumes:
  - /usr/local/Ascend/driver:/usr/local/Ascend/driver
  - /usr/local/Ascend/add-ons:/usr/local/Ascend/add-ons

# Container options
container_options: >-
  --privileged
  --shm-size=100g
  --ipc=host
  --ulimit memlock=-1
  --ulimit stack=67108864
  --user root
  --device=/dev/davinci0
  --device=/dev/davinci1
  --device=/dev/davinci2
  --device=/dev/davinci3
  --device=/dev/davinci_manager
  --device=/dev/devmm_svm
  --device=/dev/hisi_hdc

# Platform-specific environment setup script
setup_script: .github/scripts/setup_ascend.sh

# Build environment variables
build_env:
  PLATFORM: ascend
  TE_FL_SKIP_CUDA: '1'
  NVTE_FRAMEWORK: pytorch
  NVTE_WITH_CUDA: '0'
  NVTE_WITH_MACA: '0'
  TE_WITH_NCCL: '0'
  ASCEND_VISIBLE_DEVICES: '0,1,2,3'
  ASCEND_RT_VISIBLE_DEVICES: '0,1,2,3'
  PYTORCH_NPU_ALLOC_CONF: expandable_segments:True

coverage:
  enabled: true
  required: true
  python: python3
  sources:
    - transformer_engine/pytorch/*
    - transformer_engine/debug/*
    - transformer_engine/plugin/*
  omit:
    - '*/setup.py'
    - '*/transformer_engine/plugin/core/_build_config.py'

unit_test_matrix:
  - name: pytorch_debug
    runner: pytest
    log_dir: logs/L0_pytorch_debug_unittest-ascend
    pytest_args: ['-v', '-s']
    env:
      TORCHDYNAMO_DISABLE: '1'
    steps:
      - name: debug sanity
        junit: test_sanity.xml
        targets: [tests/pytorch/debug/test_sanity.py]
        args:
          - --feature_dirs=transformer_engine/debug/features
      - name: debug config
        junit: test_config.xml
        targets: [tests/pytorch/debug/test_config.py]
        args:
          - --feature_dirs=transformer_engine/debug/features
      - name: debug numerics
        junit: test_numerics.xml
        targets: [tests/pytorch/debug/test_numerics.py]
        args:
          - --feature_dirs=transformer_engine/debug/features
      - name: debug log
        junit: test_log.xml
        targets: [tests/pytorch/debug/test_log.py]
        args:
          - --feature_dirs=transformer_engine/debug/features
          - --configs_dir=tests/pytorch/debug/test_configs/
      - name: debug API features
        junit: test_api_features.xml
        targets: [tests/pytorch/debug/test_api_features.py]
        args:
          - --no-header
          - --feature_dirs=transformer_engine/debug/features
          - --configs_dir=tests/pytorch/debug/test_configs/
        env:
          NVTE_TORCH_COMPILE: '0'
      - name: debug performance
        junit: test_perf.xml
        targets: [tests/pytorch/debug/test_perf.py]
        args:
          - --feature_dirs=transformer_engine/debug/features
          - --configs_dir=tests/pytorch/debug/test_configs/

  - name: pytorch_unittest
    runner: pytest
    log_dir: logs/L0_pytorch_unittest-ascend
    pytest_args: ['-v', '-s', '--tb=short']
    steps:
      - name: Ascend TE module smoke tests
        junit: pytest_ascend_backend_smoke.xml
        targets: [tests/pytorch/ascend/test_backend_smoke.py]
      - name: Ascend FlagOS operator tests
        junit: pytest_ascend_backend_ops.xml
        targets: [tests/pytorch/ascend/test_backend_ops.py]
      - name: plugin policy
        junit: pytest_test_plugin_policy.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_plugin_policy.py]
      - name: plugin manager
        junit: pytest_test_plugin_manager.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_plugin_manager.py]
      - name: FlagOS backend lifecycle
        junit: pytest_test_backend_flagos.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_backend_flagos.py]
      - name: reference backend lifecycle
        junit: pytest_test_backend_reference.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_backend_reference.py]
      - name: reference activation operations
        junit: pytest_test_backend_reference_activation.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_backend_reference_activation.py]
      - name: reference dropout operations
        junit: pytest_test_backend_reference_dropout.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_backend_reference_dropout.py]
      - name: reference GEMM operations
        junit: pytest_test_backend_reference_gemm.xml
        use_platform_runner: false
        targets: [transformer_engine/plugin/tests/test_backend_reference_gemm.py]
      - name: shared portable sanity tests
        junit: pytest_shared_sanity_portable.xml
        env:
          NVTE_FLASH_ATTN: '0'
          NVTE_FUSED_ATTN: '0'
          NVTE_UNFUSED_ATTN: '1'
        targets:
          - 'tests/pytorch/test_sanity.py::test_sanity_normalization_amp[LayerNorm-False-False-small-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_normalization_amp[RMSNorm-False-False-small-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_linear[False-False-False-small-None-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_linear[False-LayerNorm-False-False-False-small-None-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_linear[False-RMSNorm-False-False-False-small-None-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp[False-False-LayerNorm-gelu-False-False-False-small-None-dtype0]'
          - 'tests/pytorch/test_sanity.py::test_sanity_layernorm_mlp[False-False-RMSNorm-silu-False-False-False-small-None-dtype0]'
      - name: shared non-FP8 numerics and unfused attention tests
        junit: pytest_shared_numerics_portable.xml
        env:
          NVTE_FLASH_ATTN: '0'
          NVTE_FUSED_ATTN: '0'
          NVTE_UNFUSED_ATTN: '1'
        targets:
          - 'tests/pytorch/test_numerics.py::test_linear_accuracy[False-False-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_linear_accuracy[False-False-small-1-dtype1]'
          - 'tests/pytorch/test_numerics.py::test_layernorm_accuracy[False-1e-05-126m-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_rmsnorm_accuracy[False-1e-05-126m-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_layernorm_linear_accuracy[False-False-False-LayerNorm-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_layernorm_linear_accuracy[False-False-False-RMSNorm-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_layernorm_mlp_accuracy[False-False-LayerNorm-gelu-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_layernorm_mlp_accuracy[False-False-RMSNorm-silu-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_dpa_accuracy[126m-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_mha_accuracy[causal-small-1-dtype0]'
          - 'tests/pytorch/test_numerics.py::test_mha_accuracy[no_mask-small-1-dtype0]'

  - name: pytorch_distributed_unittest
    runner: pytest
    log_dir: logs/L1_pytorch_distributed_unittest-ascend
    pytest_args: ['-v', '-s', '--tb=short']
    steps:
      - name: two-NPU HCCL Transformer Engine test
        junit: pytest_hccl_te.xml
        targets: [tests/pytorch/distributed/test_ascend_hccl.py]
      - name: context parallel utilities
        junit: pytest_test_cp_utils.xml
        use_platform_runner: false
        targets: [tests/pytorch/attention/test_cp_utils.py]
      - name: distributed non-FP8 numerics
        junit: pytest_distributed_numerics_none.xml
        targets:
          - 'tests/pytorch/distributed/test_numerics.py::test_distributed[None]'
        env:
          NVTE_FLASH_ATTN: '0'
          NVTE_FUSED_ATTN: '0'
          NVTE_UNFUSED_ATTN: '1'
          NVTE_ASCEND_DISTRIBUTED_NUMERICS_SUBSET: '1'

  - name: pytorch_onnx_unittest
    runner: pytest
    log_dir: logs/L1_pytorch_onnx_unittest-ascend
    pytest_args: ['-v', '-s', '--tb=auto']
    env:
      NVTE_FLASH_ATTN: '0'
      NVTE_FUSED_ATTN: '0'
      NVTE_UNFUSED_ATTN: '1'
      NVTE_UnfusedDPA_Emulate_FP8: '1'
    steps:
      - name: ONNX export tests
        junit: test_onnx_export.xml
        requires_modules: [onnxruntime, onnxruntime_extensions]
        targets: [tests/pytorch/test_onnx_export.py]

# Device types to run tests on
device_types:
  - ascend
