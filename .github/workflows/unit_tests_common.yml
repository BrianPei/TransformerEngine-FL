name: Common Unit Tests

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
    inputs:
      platform:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      device:
        required: true
        type: string
      image:
        required: true
        type: string
      container_pull_policy:
        required: false
        type: string
        default: never
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      checkout_submodules:
        required: false
        type: string
        default: 'false'
      setup_script:
        required: false
        type: string
        default: ''
      test_artifact_name:
        required: false
        type: string
        default: ''
      test_artifact_path:
        required: false
        type: string
        default: ''
      test_matrix:
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 90
      coverage_enabled:
        required: false
        type: boolean
        default: false
      coverage_required:
        required: false
        type: boolean
        default: false
      coverage_sources:
        required: false
        type: string
        default: ''
      coverage_include:
        required: false
        type: string
        default: ''
      coverage_omit:
        required: false
        type: string
        default: ''
      coverage_python:
        required: false
        type: string
        default: python3
      flagcicd_test_level:
        required: false
        type: string
        default: L1
      flagcicd_risk_level:
        required: false
        type: string
        default: R1
      flagcicd_metadata:
        required: false
        type: string
        default: '{}'
        description: 'Optional JSON with run_id, task_id, parent_run_id'

jobs:
  unit_test:
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        test_group: ${{ fromJson(inputs.test_matrix) }}
    name: unit-${{ inputs.device }}-${{ matrix.test_group.name }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: --pull ${{ inputs.container_pull_policy }} ${{ inputs.container_options }}

    steps:
      - name: Prepare checkout environment
        run: |
          /usr/bin/git config --global --replace-all safe.directory '*'
          /usr/bin/git config --global --unset-all credential.helper 2>/dev/null || true
          /usr/bin/git config --system --unset-all credential.helper 2>/dev/null || true

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: ${{ inputs.checkout_submodules }}
          set-safe-directory: true

      - name: Download prebuilt test artifact
        if: inputs.test_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.test_artifact_name }}
          path: ${{ github.workspace }}/${{ inputs.test_artifact_path }}

      - name: Set up test environment
        if: inputs.setup_script != ''
        env:
          TE_CI_ARTIFACT_DIR: ${{ inputs.test_artifact_path }}
        run: bash "$GITHUB_WORKSPACE/${{ inputs.setup_script }}"

      - name: Execute tests
        working-directory: ${{ github.workspace }}
        env:
          TE_TEST_GROUP_JSON: ${{ toJson(matrix.test_group) }}
          COVERAGE_ENABLED: ${{ inputs.coverage_enabled }}
          COVERAGE_REQUIRED: ${{ inputs.coverage_required }}
          COVERAGE_SOURCES: ${{ inputs.coverage_sources }}
          COVERAGE_INCLUDE: ${{ inputs.coverage_include }}
          COVERAGE_OMIT: ${{ inputs.coverage_omit }}
          TE_TEST_MAX_RETRIES: '2'
        run: |
          set -euo pipefail

          export TE_PATH="$GITHUB_WORKSPACE"
          export TE_LIB_PATH="$(python3 -c 'import site; print(site.getsitepackages()[0])')"
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          mkdir -p logs

          echo "TE_PATH=$TE_PATH"
          echo "TE_LIB_PATH=$TE_LIB_PATH"
          echo "PYTHONPATH=$PYTHONPATH"
          echo "PATH=$PATH"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"

          coverage_active=false
          if [ "$COVERAGE_ENABLED" = "true" ]; then
            if python3 -c "import importlib.metadata as m; import coverage, pytest_cov; print('[coverage] coverage', m.version('coverage'), 'pytest-cov', m.version('pytest-cov'))"; then
              coverage_args=""
              IFS=',' read -ra sources <<< "$COVERAGE_SOURCES"
              for source in "${sources[@]}"; do
                [ -n "$source" ] && coverage_args+=" --cov=$source"
              done
              export PYTEST_ADDOPTS="${PYTEST_ADDOPTS:-}${coverage_args} --cov-append --cov-report="
              coverage_active=true
            elif [ "$COVERAGE_REQUIRED" = "true" ]; then
              echo "Coverage dependencies are required but missing from the CI image: coverage pytest-cov" >&2
              exit 1
            else
              echo "WARNING: Coverage dependencies are missing from the CI image; collection disabled"
            fi
          fi

          set +e
          python3 tests/test_utils/run_ci_test_group.py
          test_exit=$?
          set -e

          coverage_exit=0
          if [ "$coverage_active" = "true" ]; then
            shopt -s nullglob
            coverage_fragments=(.coverage.*)
            shopt -u nullglob
            if [ "${#coverage_fragments[@]}" -gt 0 ]; then
              python3 -m coverage combine --keep
            fi

            coverage_name="coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}"
            if [ -f .coverage ]; then
              coverage_command=(
                python3 -m coverage json
                -o "${coverage_name}.json"
                -i
              )
              if [ -n "$COVERAGE_INCLUDE" ]; then
                coverage_command+=(--include="$COVERAGE_INCLUDE")
              fi
              if [ -n "$COVERAGE_OMIT" ]; then
                coverage_command+=(--omit="$COVERAGE_OMIT")
              fi
              "${coverage_command[@]}"
              cp .coverage "${coverage_name}.coverage"
            else
              echo "WARNING: No raw coverage data found for ${{ matrix.test_group.name }}"
              [ "$COVERAGE_REQUIRED" = "true" ] && coverage_exit=1
            fi
          fi

          [ "$test_exit" -eq 0 ] && [ "$coverage_exit" -eq 0 ]
        timeout-minutes: ${{ inputs.timeout_minutes }}

      - name: Upload test logs and reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-reports-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}
          path: |
            logs/
            **/*.log
            **/*.xml
            **/summary.json
            **/summary.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage artifact
        if: ${{ !cancelled() && inputs.coverage_enabled }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}
          path: |
            coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}.json
            coverage-${{ inputs.platform }}-${{ inputs.device }}-${{ matrix.test_group.name }}.coverage
          if-no-files-found: ignore

  aggregate_coverage:
    name: unit-${{ inputs.device }}-pytorch-unittest-coverage
    needs: unit_test
    if: ${{ always() && inputs.coverage_enabled }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: --pull ${{ inputs.container_pull_policy }} ${{ inputs.container_options }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          set-safe-directory: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch_*
          path: coverage-artifacts
          merge-multiple: true

      - name: Aggregate PyTorch coverage
        id: aggregate
        env:
          COVERAGE_REQUIRED: ${{ inputs.coverage_required }}
          COVERAGE_INCLUDE: ${{ inputs.coverage_include }}
          COVERAGE_OMIT: ${{ inputs.coverage_omit }}
          COVERAGE_PYTHON: ${{ inputs.coverage_python }}
        run: |
          set -euo pipefail
          "$COVERAGE_PYTHON" -c "import importlib.metadata as m; import coverage; print('[coverage] coverage', m.version('coverage'))"

          mkdir -p coverage-raw
          coverage_count=0
          for coverage_file in coverage-artifacts/*.coverage; do
            [ -f "$coverage_file" ] || continue
            coverage_count=$((coverage_count + 1))
            cp "$coverage_file" "coverage-raw/.coverage.$coverage_count"
          done

          if [ "$coverage_count" -eq 0 ]; then
            echo "coverage_aggregated=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No raw coverage files found for aggregation"
            if [ "$COVERAGE_REQUIRED" = "true" ]; then
              exit 1
            fi
            exit 0
          fi

          "$COVERAGE_PYTHON" -m coverage combine coverage-raw
          coverage_name="coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json"
          coverage_command=(
            "$COVERAGE_PYTHON" -m coverage json
            -o "$coverage_name"
            -i
          )
          if [ -n "$COVERAGE_INCLUDE" ]; then
            coverage_command+=(--include="$COVERAGE_INCLUDE")
          fi
          if [ -n "$COVERAGE_OMIT" ]; then
            coverage_command+=(--omit="$COVERAGE_OMIT")
          fi
          "${coverage_command[@]}"
          echo "coverage_aggregated=true" >> "$GITHUB_OUTPUT"

      - name: Create FlagCICD report
        if: always()
        env:
          FLAGCICD_TEST_LEVEL: ${{ inputs.flagcicd_test_level }}
          FLAGCICD_RISK_LEVEL: ${{ inputs.flagcicd_risk_level }}
          FLAGCICD_METADATA: ${{ inputs.flagcicd_metadata }}
          COVERAGE_PYTHON: ${{ inputs.coverage_python }}
          UNIT_TEST_RESULT: ${{ needs.unit_test.result }}
          AGGREGATE_RESULT: ${{ steps.aggregate.outcome }}
        run: |
          set -euo pipefail
          report_status=passed
          case "$UNIT_TEST_RESULT" in
            success) report_status=passed ;;
            failure) report_status=test_failed ;;
            cancelled) report_status=cancelled ;;
            skipped) report_status=skipped ;;
            *) report_status=infra_error ;;
          esac
          if [ "$UNIT_TEST_RESULT" = "success" ] && [ "$AGGREGATE_RESULT" != "success" ]; then
            report_status=report_error
          fi

          # Extract metadata from JSON or use defaults
          TASK_ID=$(echo "$FLAGCICD_METADATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('task_id',''))" 2>/dev/null || echo "")
          RUN_ID=$(echo "$FLAGCICD_METADATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('run_id',''))" 2>/dev/null || echo "$GITHUB_RUN_ID")
          PARENT_RUN_ID=$(echo "$FLAGCICD_METADATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('parent_run_id',''))" 2>/dev/null || echo "")

          # Get actual commit SHA
          ACTUAL_SHA=$(git rev-parse HEAD 2>/dev/null || echo "$GITHUB_SHA")

          coverage_path="coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json"
          report_path="flagcicd-report-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json"
          report_args=(
            --output "$report_path"
            --repository "$GITHUB_REPOSITORY"
            --source-sha "$ACTUAL_SHA"
            --run-id "$RUN_ID"
            --task-id "$TASK_ID"
            --parent-run-id "$PARENT_RUN_ID"
            --test-level "$FLAGCICD_TEST_LEVEL"
            --risk-level "$FLAGCICD_RISK_LEVEL"
            --platform "${{ inputs.platform }}"
            --device "${{ inputs.device }}"
            --image-ref "${{ inputs.image }}"
            --status "$report_status"
            --source-root "transformer_engine"
            --scope "unit"
            --coverage-version "$($COVERAGE_PYTHON -c 'import importlib.metadata as m; print(m.version("coverage"))' 2>/dev/null || true)"
          )
          if [ -f "$coverage_path" ]; then
            report_args+=(--coverage "$coverage_path" --artifact "$coverage_path")
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/flagcicd_report.py" "${report_args[@]}"
          echo "FLAGCICD_REPORT_PATH=$report_path" >> "$GITHUB_ENV"

      - name: Upload FlagCICD report artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flagcicd-report-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest
          path: flagcicd-report-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Check coverage regression
        if: |
          always() &&
          steps.aggregate.outputs.coverage_aggregated == 'true' &&
          github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          echo "🔍 Checking coverage regression against main branch baseline..."

          artifact_name="flagcicd-report-${PLATFORM}-${DEVICE}-pytorch-unittest"
          baseline_dir="$RUNNER_TEMP/flagcicd-baseline"
          baseline_run_file="$RUNNER_TEMP/flagcicd-baseline-run-id"
          baseline_log="$RUNNER_TEMP/flagcicd-baseline-fetch.log"
          set +e
          python3 "$GITHUB_WORKSPACE/.github/scripts/fetch_flagcicd_baseline.py" \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --artifact-name "$artifact_name" \
            --output-dir "$baseline_dir" \
            >"$baseline_run_file" 2>"$baseline_log"
          fetch_status=$?
          set -e

          if [ "$fetch_status" -eq 2 ]; then
            cat "$baseline_log"
            echo "⚠️  No baseline report artifact found on main branch for ${PLATFORM}-${DEVICE}"
            echo "   Skipping regression check (baseline will be established after merge)"
            exit 0
          fi
          if [ "$fetch_status" -ne 0 ]; then
            cat "$baseline_log" >&2
            echo "::warning::Unable to query the main-branch FlagCICD baseline; regression check skipped"
            exit 0
          fi

          BASELINE_RUN=$(tr -d '[:space:]' < "$baseline_run_file")
          echo "📥 Downloaded baseline from run ID: $BASELINE_RUN"
          BASELINE_FILE="$baseline_dir/flagcicd-report-${PLATFORM}-${DEVICE}-pytorch-unittest.json"
          CURRENT_FILE="${FLAGCICD_REPORT_PATH:-flagcicd-report-${PLATFORM}-${DEVICE}-pytorch-unittest.json}"

          if [ ! -f "$BASELINE_FILE" ]; then
            echo "⚠️  Baseline report not found in downloaded artifacts"
            exit 0
          fi

          if [ ! -f "$CURRENT_FILE" ]; then
            echo "⚠️  Current coverage file not found: $CURRENT_FILE"
            exit 0
          fi

          echo "📊 Running regression analysis..."
          echo "   Baseline: $BASELINE_FILE"
          echo "   Current:  $CURRENT_FILE"

          # Get platform-specific threshold from golden_baseline.json
          THRESHOLD=$(python3 - <<'PYEOF'
          import json, os
          try:
              baseline_config = json.load(open(".flagcicd/golden_baseline.json"))
              platform = os.environ["PLATFORM"].lower()
              if platform in baseline_config.get("platforms", {}):
                  threshold = baseline_config["platforms"][platform]["absolute_threshold_percent"]
              elif "other" in baseline_config.get("platforms", {}):
                  threshold = baseline_config["platforms"]["other"]["absolute_threshold_percent"]
              else:
                  threshold = 2.0
              print(threshold)
          except Exception:
              print("2.0")
          PYEOF
          )

          echo "   Threshold: ${THRESHOLD}%"

          python3 .github/scripts/flagcicd_regression.py \
            --current "$CURRENT_FILE" \
            --baseline "$BASELINE_FILE" \
            --threshold "$THRESHOLD" \
            --output regression-verdict.json || {
              echo ""
              echo "⚠️  Coverage regression detected!"
              cat regression-verdict.json | python3 -m json.tool || cat regression-verdict.json
              echo ""
              echo "📌 Note: This check is currently in advisory mode (non-blocking)"
              echo "   Coverage regression will not fail the PR"
              exit 0
            }

          echo ""
          echo "✅ No coverage regression detected"
          cat regression-verdict.json | python3 -m json.tool || cat regression-verdict.json

      - name: Upload regression verdict
        if: always() && steps.aggregate.outputs.coverage_aggregated == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: regression-verdict-${{ inputs.platform }}-${{ inputs.device }}
          path: regression-verdict.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload aggregated coverage artifact
        if: steps.aggregate.outputs.coverage_aggregated == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest
          path: coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json

      - name: Upload coverage report to FlagCICD
        if: ${{ !cancelled() && steps.aggregate.outputs.coverage_aggregated == 'true' }}
        uses: flagos-ai/FlagOps/actions/post-pytest-report@v2
        continue-on-error: true
        with:
          backend_url: 'https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/'
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          report_path: coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest.json
          # Default github.job is shared by every platform/device.
          job_name: coverage-${{ inputs.platform }}-${{ inputs.device }}-pytorch-unittest
          fail_on_error: 'false'
