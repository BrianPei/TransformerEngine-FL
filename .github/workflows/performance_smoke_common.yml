name: Common Performance Smoke

on:
  workflow_call:
    secrets:
      FLAGCICD_API_TOKEN:
        required: false
    inputs:
      platform:
        required: true
        type: string
      file_type:
        required: false
        type: string
        default: performance
      checkout_ref:
        required: false
        type: string
        default: ''
      device:
        required: true
        type: string
      image:
        required: true
        type: string
      container_pull_policy:
        required: false
        type: string
        default: never
      runs_on:
        required: true
        type: string
      container_volumes:
        required: true
        type: string
      container_options:
        required: true
        type: string
      setup_script:
        required: false
        type: string
        default: ''
      test_artifact_name:
        required: false
        type: string
        default: ''
      test_artifact_path:
        required: false
        type: string
        default: ''
      checkout_submodules:
        required: false
        type: string
        default: 'false'

jobs:
  performance_smoke:
    defaults:
      run:
        shell: bash
    runs-on: ${{ fromJson(inputs.runs_on) }}
    name: perf-smoke-${{ inputs.platform }}-${{ inputs.device }}
    env:
      REPORT_NAME: perf-smoke-${{ inputs.platform }}-${{ inputs.device }}
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
      volumes: ${{ fromJson(inputs.container_volumes) }}
      options: >-
        --pull ${{ inputs.container_pull_policy }} ${{ inputs.container_options }}
        ${{ vars.FLAGCICD_HOST_IP && format('--add-host flagcicd-inner.flagos.net:{0}', vars.FLAGCICD_HOST_IP) || '' }}

    steps:
      - name: Prepare Checkout Environment
        run: |
          /usr/bin/git config --global --replace-all safe.directory '*'
          /usr/bin/git config --global --unset-all credential.helper 2>/dev/null || true
          /usr/bin/git config --system --unset-all credential.helper 2>/dev/null || true

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: ${{ inputs.checkout_submodules }}
          set-safe-directory: true

      - name: Download prebuilt test artifact
        if: inputs.test_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.test_artifact_name }}
          path: ${{ github.workspace }}/${{ inputs.test_artifact_path }}

      - name: Environment Setup
        if: inputs.setup_script != ''
        env:
          TE_CI_ARTIFACT_DIR: ${{ inputs.test_artifact_path }}
        run: bash "$GITHUB_WORKSPACE/${{ inputs.setup_script }}"

      - name: Execute performance smoke
        timeout-minutes: 10
        env:
          TE_CI_IMAGE: ${{ inputs.image }}
          TE_SMOKE_PLATFORM: ${{ inputs.platform }}
          TE_SMOKE_DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          export TE_PATH="$GITHUB_WORKSPACE"
          export TE_LIB_PATH="${TE_LIB_PATH:-$(python3 -c 'import site; print(site.getsitepackages()[0])')}"
          export TE_TEST_COMMIT="$(git rev-parse HEAD)"
          unset COVERAGE_PROCESS_START COVERAGE_FILE PYTEST_ADDOPTS
          mkdir -p logs
          python3 tests/test_utils/run_performance_smoke.py \
            --platform "$TE_SMOKE_PLATFORM" --device "$TE_SMOKE_DEVICE" \
            --report "$REPORT_NAME.json" 2>&1 | tee "logs/$REPORT_NAME.log"

      - name: Upload performance artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_NAME }}
          path: |
            ${{ env.REPORT_NAME }}.json
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload performance report to FlagCICD
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FLAGCICD_API_TOKEN: ${{ secrets.FLAGCICD_API_TOKEN }}
          REPORT_FILE_TYPE: ${{ inputs.file_type }}
        run: |
          python3 .github/scripts/ci/upload_report.py \
            --report "$REPORT_NAME.json" \
            --file-type "$REPORT_FILE_TYPE"
