name: FlagCICD Entry

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Optional git ref to checkout'
        required: false
        default: ''
        type: string
      platforms:
        description: 'JSON array of platform names, for example ["cuda"]'
        required: false
        default: '["cuda"]'
        type: string
      test_level:
        description: 'FlagCICD test level'
        required: false
        default: L1
        type: choice
        options: [L0, L1, L2, L3, L4]
      risk_level:
        description: 'Change risk level'
        required: false
        default: auto
        type: string
      changed_files:
        description: 'Optional JSON array used by the v1 risk mapper'
        required: false
        default: '[]'
        type: string
      task_id:
        description: 'Optional Agent or external task id'
        required: false
        default: ''
        type: string
      parent_run_id:
        description: 'Optional parent run id'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [flagcicd]

concurrency:
  group: flagcicd-${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Build FlagCICD test plan
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.normalize.outputs.platforms }}
      test_level: ${{ steps.normalize.outputs.test_level }}
      risk_level: ${{ steps.normalize.outputs.risk_level }}
      risk_rule_version: ${{ steps.normalize.outputs.risk_rule_version }}
      task_id: ${{ steps.normalize.outputs.task_id }}
      parent_run_id: ${{ steps.normalize.outputs.parent_run_id }}
      run_integration_tests: ${{ steps.normalize.outputs.run_integration_tests }}
      run_unit_tests: ${{ steps.normalize.outputs.run_unit_tests }}
      run_fa_version_tests: ${{ steps.normalize.outputs.run_fa_version_tests }}
      actual_sha: ${{ steps.resolve_sha.outputs.actual_sha }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.event.client_payload.checkout_ref || '' }}

      - name: Resolve actual commit SHA
        id: resolve_sha
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "actual_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "📌 Source commit for this run: $ACTUAL_SHA"

      - name: Validate and normalize request
        id: normalize
        env:
          PLATFORMS_INPUT: ${{ inputs.platforms || github.event.client_payload.platforms || '["cuda"]' }}
          TEST_LEVEL_INPUT: ${{ inputs.test_level || github.event.client_payload.test_level || 'L1' }}
          RISK_LEVEL_INPUT: ${{ inputs.risk_level || github.event.client_payload.risk_level || 'auto' }}
          CHANGED_FILES_INPUT: ${{ inputs.changed_files || github.event.client_payload.changed_files || '[]' }}
          TASK_ID_INPUT: ${{ inputs.task_id || github.event.client_payload.task_id || '' }}
          PARENT_RUN_ID_INPUT: ${{ inputs.parent_run_id || github.event.client_payload.parent_run_id || '' }}
        run: |
          set -euo pipefail
          # Validate platforms
          PYTHONPATH="$GITHUB_WORKSPACE" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          platforms = json.loads(os.environ["PLATFORMS_INPUT"])
          if not isinstance(platforms, list) or not platforms or not all(isinstance(item, str) for item in platforms):
              raise SystemExit("platforms must be a non-empty JSON array of strings")
          Path(os.environ["RUNNER_TEMP"], "flagcicd-platforms.json").write_text(
              json.dumps(platforms, separators=(",", ":")), encoding="utf-8"
          )
          PY
          python3 .github/scripts/flagcicd_plan.py \
            --changed-files "$CHANGED_FILES_INPUT" \
            --requested-level "$TEST_LEVEL_INPUT" \
            --requested-risk "$RISK_LEVEL_INPUT" \
            --output "$RUNNER_TEMP/flagcicd-plan.json"

          # Check final test level after risk mapping
          FINAL_LEVEL=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/flagcicd-plan.json'))['test_level'])")
          if [ "$FINAL_LEVEL" = "L3" ] || [ "$FINAL_LEVEL" = "L4" ]; then
            echo "::error::Risk mapping produced unsupported test level: $FINAL_LEVEL"
            echo ""
            echo "Requested: $TEST_LEVEL_INPUT"
            echo "Final (after risk mapping): $FINAL_LEVEL"
            echo ""
            echo "L3/L4 are not yet supported (see .flagcicd/project.yaml)"
            echo "Please modify changed files or request a lower test level"
            exit 1
          fi

          PLAN_PATH="$RUNNER_TEMP/flagcicd-plan.json" python3 - <<'PY'
          import json
          import os

          plan = json.loads(open(os.environ["PLAN_PATH"], encoding="utf-8").read())

          # Compute task_id
          task_id_input = os.environ["TASK_ID_INPUT"]
          task_id = task_id_input if task_id_input else f"te-{os.environ['GITHUB_RUN_ID']}"

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write("platforms=" + os.environ["PLATFORMS_INPUT"] + "\n")
              output.write(f"test_level={plan['test_level']}\n")
              output.write(f"risk_level={plan['risk_level']}\n")
              output.write(f"risk_rule_version={plan['risk_rule_version']}\n")
              output.write(f"task_id={task_id}\n")
              output.write(f"parent_run_id={os.environ['PARENT_RUN_ID_INPUT']}\n")
              output.write(f"run_unit_tests={str(plan['test_level'] != 'L0').lower()}\n")
              output.write(f"run_integration_tests={str(plan['test_level'] in {'L2', 'L3', 'L4'}).lower()}\n")
              output.write(f"run_fa_version_tests={str(plan['test_level'] in {'L3', 'L4'}).lower()}\n")
          PY

  run_tests:
    name: Run ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.plan.outputs.platforms) }}
    uses: ./.github/workflows/all_tests_common.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.actual_sha }}
      platform: ${{ matrix.platform }}
      run_unit_tests: ${{ needs.plan.outputs.run_unit_tests == 'true' }}
      run_integration_tests: ${{ needs.plan.outputs.run_integration_tests == 'true' }}
      test_level: ${{ needs.plan.outputs.test_level }}
      risk_level: ${{ needs.plan.outputs.risk_level }}
      flagcicd_metadata: ${{ format('{{"run_id":"{0}","task_id":"{1}","parent_run_id":"{2}","actual_sha":"{3}"}}', github.run_id, needs.plan.outputs.task_id, needs.plan.outputs.parent_run_id, needs.plan.outputs.actual_sha) }}

  run_fa_version_tests:
    name: FA Version Compatibility (L3/L4)
    needs: plan
    if: needs.plan.outputs.run_fa_version_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.actual_sha }}

      - name: FA Version Tests Placeholder
        run: |
          echo "::error::L3 Flash Attention tests not yet enabled"
          echo ""
          echo "🔬 Flash Attention Version Compatibility Tests (L3)"
          echo ""
          echo "Status: NOT YET ENABLED"
          echo "Reason: Requires Hopper+ GPUs and workflow trigger enablement"
          echo ""
          echo "To enable:"
          echo "  1. Ensure Hopper or higher GPU availability"
          echo "  2. Update qa-l3-te-pytorch-fa-versions-test.yml trigger branches"
          echo "  3. Remove this placeholder and call the actual workflow"
          echo ""
          exit 1

  run_l4_validation:
    name: Release Validation (L4 only)
    needs: plan
    if: needs.plan.outputs.test_level == 'L4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.actual_sha }}

      - name: L4 Release Validation Placeholder
        run: |
          echo "::error::L4 release validation not yet implemented"
          echo ""
          echo "🚀 Release Validation Tests (L4)"
          echo ""
          echo "Status: NOT YET IMPLEMENTED"
          echo "Reason: Requires cross-repo coordination and test definition"
          echo ""
          echo "Required implementation:"
          echo "  1. Define cross-repo integration test scenarios with Megatron-LM-FL"
          echo "  2. Define cross-repo integration test scenarios with vLLM-plugin-FL"
          echo "  3. Define model training/inference validation criteria"
          echo "  4. Define release artifact validation (wheel, docs)"
          echo "  5. Define backward compatibility test matrix"
          echo ""
          echo "Contact: Cross-repo CI/CD coordination team"
          echo ""
          exit 1

  entry_complete:
    name: Aggregate FlagCICD reports
    if: always()
    needs: [plan, run_tests, run_fa_version_tests, run_l4_validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.actual_sha }}

      - name: Download platform reports
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flagcicd-report-*
          path: flagcicd-reports
          merge-multiple: true

      - name: Aggregate platform reports
        id: aggregate
        env:
          EXPECTED_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          RUN_ID: ${{ github.run_id }}
          TASK_ID: ${{ needs.plan.outputs.task_id }}
          PARENT_RUN_ID: ${{ needs.plan.outputs.parent_run_id }}
          SOURCE_SHA: ${{ needs.plan.outputs.actual_sha }}
          TEST_LEVEL: ${{ needs.plan.outputs.test_level }}
          RISK_LEVEL: ${{ needs.plan.outputs.risk_level }}
        run: |
          set -euo pipefail
          python3 .github/scripts/aggregate_flagcicd_reports.py \
            --input-dir flagcicd-reports \
            --output flagcicd-run-summary.json \
            --expected-platforms "$EXPECTED_PLATFORMS" \
            --run-id "$RUN_ID" \
            --task-id "$TASK_ID" \
            --parent-run-id "$PARENT_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --test-level "$TEST_LEVEL" \
            --risk-level "$RISK_LEVEL" \
            --platform-job-result "${{ needs.run_tests.result }}"

      - name: Upload FlagCICD run summary
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flagcicd-run-summary
          path: flagcicd-run-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check platform results
        if: always()
        run: |
          if [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "::error::FlagCICD platform jobs failed: ${{ needs.run_tests.result }}"
            exit 1
          fi

          if [ "${{ steps.aggregate.outcome }}" != "success" ]; then
            echo "::error::Report aggregation failed: ${{ steps.aggregate.outcome }}"
            exit 1
          fi

          echo "✅ FlagCICD entry completed successfully"
